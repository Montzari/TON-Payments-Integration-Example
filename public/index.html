<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with ton - Example</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f0f2f5;}
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        #ton-connect-btn { display: flex; justify-content: center; margin-bottom: 25px; }
        #points-display { font-size: 28px; font-weight: bold; margin: 25px 0; color: #333; }
        Owner 
        button.action-btn { 
            padding: 14px 24px; font-size: 16px; cursor: pointer; 
            background-color: #0088CC; color: white; border: none; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.3s;
        }
        button.action-btn:hover { background-color: #0077B5; }
        button.action-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #status-message { margin-top: 20px; font-size: 14px; font-weight: bold; color: #0088CC; min-height: 20px;}
        .success { color: #28a745 !important; }
        .error { color: #dc3545 !important; }
    </style>
</head>
<body>

    <div class="card">
        
        <div id="ton-connect-btn"></div>
        <div id="points-display">Points: <span id="points">0</span></div>

        <button id="pay-button" class="action-btn">Pay 0.0001 TON for 10 Points</button>
        <div id="status-message"></div>
    </div>

    <script>
        const DESTINATION_ADDRESS = "UQABwbjxtoygk_zBn4N2P9HJDGnScNLuDwPrpcCCwXQWjczP"; 
        const AMOUNT_NANOTONS = "100000"; // 0.0001 TON

        const pointsElement = document.getElementById('points');
        const payButton = document.getElementById('pay-button');
        const statusMessage = document.getElementById('status-message');

        const manifestUrl = window.location.origin + '/tonconnect-manifest.json';
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: manifestUrl,
            buttonRootId: 'ton-connect-btn'
        });

        // 1. Fetch points when wallet connects
        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const rawAddress = wallet.account.address;
                try {
                    const res = await fetch(`/api/points/${rawAddress}`);
                    const data = await res.json();
                    pointsElement.innerText = data.points;
                    statusMessage.innerText = "Wallet securely connected.";
                } catch (e) {}
            } else {
                pointsElement.innerText = "0";
                statusMessage.innerText = "Wallet disconnected.";
            }
        });

        // 2. Handle Payment
        payButton.addEventListener('click', async () => {
            if (!tonConnectUI.connected) {
                alert("Please connect your wallet first!");
                return;
            }

            const senderRawAddress = tonConnectUI.account.address; 
            
            // Build native TON transaction payload
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 120, // Expires in 2 minutes
                messages: [{ address: DESTINATION_ADDRESS, amount: AMOUNT_NANOTONS }]
            };
            
            try {
                payButton.disabled = true;
                statusMessage.className = "";
                statusMessage.innerText = "Please approve the transaction in your wallet...";

                // Ask wallet to send the money
                await tonConnectUI.sendTransaction(transaction);
                
                statusMessage.innerText = "Sent! Waiting for Mainnet blockchain confirmation...";
                
                // Poll backend to verify receipt
                let attempts = 0;
                const maxAttempts = 15; 

                const pollInterval = setInterval(async () => {
                    attempts++;
                    statusMessage.innerText = `Verifying on Mainnet... (Attempt ${attempts}/${maxAttempts})`;

                    try {
                        const res = await fetch('/api/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ senderAddress: senderRawAddress })
                        });
                        
                        if (!res.ok) return; // Skip a tick if the API briefly times out
                        
                        const data = await res.json();

                        if (data.success) {
                            clearInterval(pollInterval);
                            pointsElement.innerText = data.points;
                            statusMessage.className = "success";
                            statusMessage.innerText = "Payment Verified! +10 Points.";
                            payButton.disabled = false;
                        } else if (attempts >= maxAttempts) {
                            clearInterval(pollInterval);
                            statusMessage.className = "error";
                            statusMessage.innerText = "Verification timed out. Try refreshing.";
                            payButton.disabled = false;
                        }
                    } catch (err) {}
                }, 6000); // Check every 6 seconds

            } catch (error) {
                console.error(error);
                statusMessage.className = "error";
                statusMessage.innerText = error.message || "Payment cancelled or failed.";
                payButton.disabled = false;
            }
        });
    </script>
</body>
</html>
